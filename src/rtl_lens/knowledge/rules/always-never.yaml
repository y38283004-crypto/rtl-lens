schema_version: "1.0"
rule_id: always-never
severity: warning
en:
  title: Implicit sensitivity list has no trigger
  cause: An always @* process reads no signal, so its inferred event list is empty and the process never wakes.
  risk: Intended initialization or constant output logic may never execute in simulation, hiding behavior that differs from the intended hardware.
  fix: Use always_comb for constant combinational behavior, or add the real data dependency, clock, or event that is intended to trigger the process.
zh-CN:
  title: 隐式敏感列表没有任何触发源
  cause: always @* 过程没有读取任何信号，因此推导出的事件列表为空，过程不会被唤醒执行。
  risk: 预期的初始化或常量输出逻辑可能在仿真中从不执行，从而掩盖与目标硬件不一致的行为。
  fix: 常量组合逻辑应使用 always_comb；其他情况应加入真实的数据依赖、时钟或预期事件作为触发源。
failing_example: failing/always-never.sv
fixed_example: fixed/always-never.sv
references: [https://verilator.org/guide/latest/warnings.html#alwnever]
review_status: reviewed
engine_mappings:
  - engine: verilator
    code: ALWNEVER
    verification: container
