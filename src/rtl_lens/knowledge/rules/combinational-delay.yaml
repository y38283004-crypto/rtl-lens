schema_version: "1.0"
rule_id: combinational-delay
severity: warning
en:
  title: Combinational logic uses a nonblocking assignment
  cause: A combinational process uses a nonblocking assignment (<=), which defers its update instead of immediately updating the value like a blocking assignment (=).
  risk: Deferred updates can make simulation behavior differ from the combinational intent; Verilator may convert the assignment to blocking execution.
  fix: Use blocking assignments (=) for combinational logic and reserve nonblocking assignments (<=) for appropriate clocked sequential processes.
zh-CN:
  title: 组合逻辑中使用了非阻塞赋值
  cause: 组合过程使用了非阻塞赋值（<=），其更新会被推迟，而不是像阻塞赋值（=）一样立即更新值。
  risk: 推迟更新可能使仿真行为偏离组合逻辑的设计意图；Verilator 可能将该赋值转换为阻塞执行。
  fix: 组合逻辑使用阻塞赋值（=），非阻塞赋值（<=）用于适当的时钟触发时序过程。
failing_example: failing/combinational-delay.sv
fixed_example: fixed/combinational-delay.sv
references: [https://verilator.org/guide/latest/warnings.html#combdly]
review_status: reviewed
engine_mappings:
  - engine: verilator
    code: COMBDLY
    verification: container
