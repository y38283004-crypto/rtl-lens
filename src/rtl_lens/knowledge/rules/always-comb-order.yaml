schema_version: "1.0"
rule_id: always-comb-order
severity: warning
en:
  title: Combinational block reads a value before writing it
  cause: An always_comb block consumes an intermediate variable before a later statement assigns that variable in the same activation.
  risk: The read can observe the previous value, creating state-like behavior or results that vary between simulators.
  fix: Order assignments by dependency so every intermediate value is written before it is read, or separate the logic into clear dependency stages.
zh-CN:
  title: 组合过程先读取后写入中间变量
  cause: always_comb 过程在一次执行中先使用某个中间变量，随后才在后面的语句中给它赋值。
  risk: 读取操作可能取得该变量的旧值，从而产生类似状态保持的行为，或造成不同仿真器结果不一致。
  fix: 按依赖顺序排列赋值，确保中间变量先写后读；必要时将逻辑拆成依赖关系清晰的阶段。
failing_example: failing/always-comb-order.sv
fixed_example: fixed/always-comb-order.sv
references: [https://verilator.org/guide/latest/warnings.html#alwcomborder]
review_status: reviewed
engine_mappings:
  - engine: verilator
    code: ALWCOMBORDER
    verification: container
