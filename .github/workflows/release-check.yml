name: Release check

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Verify and sync lock
        run: |
          uv lock --check
          uv sync --locked --all-groups
      - name: Verify documentation and package contracts
        run: |
          uv run pytest tests/docs tests/automation/test_package_contract.py tests/automation/test_release_workflow.py -q -p no:cacheprovider
          uv run python -m doctest README.md README.zh-CN.md docs/getting-started.md docs/configuration.md
          uv run python tools/generate_rule_docs.py --check
      - name: Build wheel and source distribution
        run: uv build --no-sources
      - name: Install both artifacts into clean environments
        run: |
          uv venv .release-check/wheel
          uv venv .release-check/sdist
          uv pip install --python .release-check/wheel/bin/python dist/*.whl
          uv pip install --python .release-check/sdist/bin/python dist/*.tar.gz
          uv pip check --python .release-check/wheel/bin/python
          uv pip check --python .release-check/sdist/bin/python
      - name: Smoke installed CLI and resources outside checkout
        shell: bash
        run: |
          root="$PWD"
          cd "$(mktemp -d)"
          for kind in wheel sdist; do
            "$root/.release-check/$kind/bin/rtl-lens" --help
            "$root/.release-check/$kind/bin/rtl-lens" version
            "$root/.release-check/$kind/bin/python" -I -c "import sys; from pathlib import Path; import rtl_lens; from importlib import resources; assert Path(rtl_lens.__file__).resolve().is_relative_to(Path(sys.prefix).resolve()); rule = resources.files('rtl_lens.knowledge').joinpath('rules', 'width-mismatch.yaml'); assert 'width-mismatch' in rule.read_text(encoding='utf-8')"
          done
      - name: Generate local checksums
        run: >-
          python -c "import hashlib; from pathlib import Path; root = Path('dist'); artifacts = sorted([*root.glob('*.whl'), *root.glob('*.tar.gz')]); assert len(list(root.glob('*.whl'))) == len(list(root.glob('*.tar.gz'))) == 1; (root / 'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in artifacts), encoding='utf-8')"
      - name: Retain verification artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rtl-lens-release-check-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
