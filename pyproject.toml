[project]
name = "rtl-lens"
version = "0.1.0.dev0"
description = "Explainable dual-engine diagnostics for Verilog and SystemVerilog projects"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "jinja2>=3.1,<4",
  "pydantic>=2.11,<3",
  "pyslang>=11,<12",
  "pyyaml>=6,<7",
  "rich>=13,<15",
  "typer>=0.16,<1",
]

[project.scripts]
rtl-lens = "rtl_lens.cli:app"

[dependency-groups]
dev = [
  "beautifulsoup4>=4.13,<5",
  "mypy>=1.17,<2",
  "playwright>=1.54,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
  "types-pyyaml>=6.0,<7",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13.7,<0.14"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["rtl_lens"]

# PySlang 11's Linux wheel contains generated stubs with Python keywords as
# enum members (e.g. KnownSystemName.and). Skip only this native dependency's
# stubs; keep strict checking of every RTL Lens module and runtime engine tests.
[[tool.mypy.overrides]]
module = ["pyslang", "pyslang.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true
