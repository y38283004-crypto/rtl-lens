schema_version: "1.0"
rule_id: assignment-in-expression
severity: warning
en:
  title: Assignment is embedded inside an expression
  cause: A single equals sign performs an assignment inside a complex expression where an equality comparison may have been intended.
  risk: The hidden side effect can change state while evaluating a condition and make priority or data flow difficult to review.
  fix: Move the assignment to its own statement, then test the assigned value, or use an equality operator when comparison is the real intent.
zh-CN:
  title: 复杂表达式内部包含赋值操作
  cause: 复杂表达式中使用单个等号执行了赋值，而原本可能想写的是相等比较。
  risk: 隐藏的副作用会在计算条件时改变状态，使优先级和数据流难以审查并容易产生误解。
  fix: 将赋值拆成独立语句后再判断结果；若真实意图是比较，请改用相等运算符。
failing_example: failing/assignment-in-expression.sv
fixed_example: fixed/assignment-in-expression.sv
references: [https://verilator.org/guide/latest/warnings.html#assigneqexpr]
review_status: reviewed
engine_mappings:
  - engine: verilator
    code: ASSIGNEQEXPR
    verification: container
